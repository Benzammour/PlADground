---
- name: cyberloop.local Linux server outside the domain configuration
  hosts: ubuntu_outside

  roles:
    - linux_server_basic
    - role: geerlingguy.docker
      vars:
        docker_users:
          - "vagrant"
        docker_packages:
          - "docker-ce"
          - "docker-ce-cli"
          - "containerd.io"
          - "docker-buildx-plugin"
          - "docker-compose-plugin"
      become: true
    - role: badsectorlabs.ludus_elastic_container
      vars:
        ludus_elastic_container_install_path: /opt/elastic_container
        ludus_elastic_password: "elasticpassword"
        ludus_elastic_stack_version: "9.0.1"
        ludus_elastic_container_branch: HEAD
      become: true
